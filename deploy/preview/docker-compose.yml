services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - preview_pgdata:/var/lib/postgresql/data

  backend:
    image: paritet-preview-backend:latest
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile.preview
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STRAPI_UPLOADS_DIR: /app/public/uploads
      STRAPI_UPLOADS_SEED_DIR: /app/public/uploads-seed
    volumes:
      - preview_strapi_uploads:/app/public/uploads

  web:
    image: paritet-preview-web:latest
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.preview
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
      STRAPI_INTERNAL_URL: http://backend:1337

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "${PREVIEW_HTTP_PORT:-80}:80"
      - "${PREVIEW_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - preview_caddy_data:/data
      - preview_caddy_config:/config
    environment:
      PREVIEW_SITE_ADDRESS: ${PREVIEW_SITE_ADDRESS}
      PREVIEW_BASIC_AUTH_USER: ${PREVIEW_BASIC_AUTH_USER}
      PREVIEW_BASIC_AUTH_PASSWORD_HASH: ${PREVIEW_BASIC_AUTH_PASSWORD_HASH}

volumes:
  preview_pgdata:
  preview_strapi_uploads:
  preview_caddy_data:
  preview_caddy_config:
